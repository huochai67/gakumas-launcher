name: Build and Release

on:
  workflow_dispatch:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            extension: ''
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            extension: '.exe'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build gakumas-launcher
        run: cargo build --release --locked --manifest-path launcher/Cargo.toml --bin gakumas-launcher --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: gakumas-launcher-${{ matrix.target }}
          path: launcher/target/${{ matrix.target }}/release/gakumas-launcher${{ matrix.extension }}
      - name: Build Windows native host (gakumas.exe)
        if: runner.os == 'Windows'
        run: cargo build --release --locked --manifest-path launcher/Cargo.toml --bin gakumas --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: gakumas-host-windows-x64
          path: launcher/target/${{ matrix.target }}/release/gakumas.exe

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Package release assets
        run: |
          mkdir -p dist/windows dist/linux release
          cp artifacts/gakumas-launcher-x86_64-pc-windows-msvc/gakumas-launcher.exe dist/windows/
          cp artifacts/gakumas-host-windows-x64/gakumas.exe dist/windows/
          cp artifacts/gakumas-host-windows-x64/gakumas.exe release/gakumas.exe
          (cd dist/windows && zip -r ../../release/gakumas-launcher-x86_64-pc-windows-msvc.zip .)

          cp artifacts/gakumas-launcher-x86_64-unknown-linux-gnu/gakumas-launcher dist/linux/
          chmod +x dist/linux/gakumas-launcher
          cp artifacts/gakumas-host-windows-x64/gakumas.exe dist/linux/
          tar -C dist/linux -czf release/gakumas-launcher-x86_64-unknown-linux-gnu.tar.gz .
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/gakumas-launcher-x86_64-pc-windows-msvc.zip
            release/gakumas-launcher-x86_64-unknown-linux-gnu.tar.gz
            release/gakumas.exe
